# Веб-версия BepulMed AI: https://<логин>.github.io/<репозиторий>/
# Собирается со встроенной офлайн-картой Ташкента и снимком аптек/клиник и публикуется в ветку gh-pages.
name: Web (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bepulmed/web/**", ".github/workflows/pages.yml"]
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Зависимости и тесты
        working-directory: bepulmed/web
        run: npm ci && npx vitest run
      - name: Офлайн-карта Ташкента (Protomaps / OpenStreetMap)
        working-directory: bepulmed/web
        run: bash scripts/fetch_tashkent_map.sh || echo "::warning::Карта не скачалась — сайт будет без встроенной карты"
      - name: Снимок аптек и клиник Ташкента (OpenStreetMap)
        working-directory: bepulmed/web
        run: npx tsx scripts/prefetch_offline_data.ts || echo "::warning::Overpass недоступен — снимок не встроен"
      - name: Сборка
        working-directory: bepulmed/web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build && cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Публикация в gh-pages
        working-directory: bepulmed/web/dist
        run: |
          git init -q -b gh-pages
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "### Сайт: https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
